# Docker Compose para Produção
# Use com: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: anasstore-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN?Defina APP_DOMAIN no .env (ex: app.anasstore.com.br)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - anasstore-network

  db:
    image: postgres:16
    container_name: anasstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - anasstore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anasstore-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/anasstore-backend:latest
    container_name: anasstore-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS?Defina ASPNETCORE_URLS no .env}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT?Defina ASPNETCORE_ENVIRONMENT no .env}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION?Defina DB_CONNECTION no .env}
      JwtSettings__SigningKey: ${JwtSettings__SigningKey?Defina JwtSettings__SigningKey no .env}
      JwtSettings__Issuer: ${JwtSettings__Issuer?Defina JwtSettings__Issuer no .env}
      JwtSettings__Audience: ${JwtSettings__Audience?Defina JwtSettings__Audience no .env}
      JwtSettings__ExpirationMinutes: ${JwtSettings__ExpirationMinutes?Defina JwtSettings__ExpirationMinutes no .env}
      Database__AutoMigrate: ${Database__AutoMigrate?Defina Database__AutoMigrate no .env}
      Seed__EnableLookupSeed: ${Seed__EnableLookupSeed?Defina Seed__EnableLookupSeed no .env}
      Seed__EnableDefaultUsers: ${Seed__EnableDefaultUsers?Defina Seed__EnableDefaultUsers no .env}
      # Suporta ambos formatos (variável legacy e binding padrão do .NET)
      RESEND_APITOKEN: ${RESEND_APITOKEN?Defina RESEND_APITOKEN no .env}
      Resend__ApiToken: ${RESEND_APITOKEN?Defina RESEND_APITOKEN no .env}
      Resend__FromEmail: ${Resend__FromEmail?Defina Resend__FromEmail no .env}
      Resend__FromName: ${Resend__FromName?Defina Resend__FromName no .env}
      PasswordReset__BaseUrl: ${PasswordReset__BaseUrl?Defina PasswordReset__BaseUrl no .env}
      PasswordReset__Path: ${PasswordReset__Path?Defina PasswordReset__Path no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5117:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - anasstore-network
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/anasstore-frontend:latest
    container_name: anasstore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL?Defina VITE_API_BASE_URL no .env}
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - anasstore-network
    resources:
      limits:
        cpus: '0.5'
        memory: 256M
      reservations:
        cpus: '0.25'
        memory: 128M

volumes:
  anasstore_db:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  anasstore-network:
    driver: bridge
