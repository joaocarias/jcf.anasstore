services:
  db:
    image: postgres:16
    container_name: anasstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: anasstore
      POSTGRES_USER: anasstore
      POSTGRES_PASSWORD: anasstore
    volumes:
      - anasstore_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./src/backend/jcf.anasstore
      dockerfile: Dockerfile
    container_name: anasstore-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Username=anasstore;Password=anasstore;Database=anasstore
    depends_on:
      - db
    ports:
      - "5117:8080"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: anasstore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  anasstore_db:
