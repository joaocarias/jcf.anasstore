<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc0cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb6c1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#000000"/>

  <!-- Crown -->
  <g id="crown" transform="translate(100, 30)">
    <!-- Crown base -->
    <path d="M -30 0 L -20 -15 L -5 -5 L 0 -25 L 5 -5 L 20 -15 L 30 0 Z" fill="url(#goldGradient)" stroke="#c9a961" stroke-width="1"/>
    <!-- Crown jewels -->
    <circle cx="-20" cy="-15" r="3" fill="#ffc0cb"/>
    <circle cx="0" cy="-25" r="3.5" fill="#ffb6c1"/>
    <circle cx="20" cy="-15" r="3" fill="#ffc0cb"/>
  </g>

  <!-- Circle ring -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#ffb6c1" stroke-width="0.5"/>

  <!-- Laurel wreaths left -->
  <g id="laurel-left" transform="translate(65, 100)">
    <path d="M 0 -30 Q -8 -25 -12 -15 Q -14 -5 -12 5 Q -8 15 0 18"
          fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="-4" cy="-20" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(-30 -4 -20)"/>
    <ellipse cx="-8" cy="-12" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(-45 -8 -12)"/>
    <ellipse cx="-11" cy="-2" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(-60 -11 -2)"/>
    <ellipse cx="-10" cy="8" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(-45 -10 8)"/>
  </g>

  <!-- Laurel wreaths right -->
  <g id="laurel-right" transform="translate(135, 100)">
    <path d="M 0 -30 Q 8 -25 12 -15 Q 14 -5 12 5 Q 8 15 0 18"
          fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="4" cy="-20" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(30 4 -20)"/>
    <ellipse cx="8" cy="-12" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(45 8 -12)"/>
    <ellipse cx="11" cy="-2" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(60 11 -2)"/>
    <ellipse cx="10" cy="8" rx="2" ry="4" fill="url(#goldGradient)" transform="rotate(45 10 8)"/>
  </g>

  <!-- Letter A -->
  <text x="100" y="115" font-family="Sora, serif" font-size="70" font-weight="800"
        text-anchor="middle" fill="url(#goldGradient)" letter-spacing="-2">A</text>

  <!-- Decorative flourish bottom left -->
  <path d="M 60 130 Q 65 135 70 132 Q 72 130 75 132"
        fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Decorative flourish bottom right -->
  <path d="M 130 130 Q 135 135 140 132 Q 142 130 145 132"
        fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center ornament -->
  <circle cx="100" cy="145" r="2" fill="url(#goldGradient)"/>
</svg>